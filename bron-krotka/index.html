<!DOCTYPE html>
<html lang="pl">
<head>
    <title>bronpalna-blog.pl</title>
    <meta name="weryfikacja" content="PA-B-642-3665/3874/26/DK/28,29">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <script src="/js/header.js"></script>
    <div class="container">
        <!-- Treść strony -->
        <h2 class="section-title">Broń krótka</h2>
        <div id="short-posts" class="posts"></div>
    </div>
    <script>
      fetch('/wpisy/bron-krotka/meta.json')
      .then(r => r.json())
      .then(posts => render(posts));
      
      function render(posts) {
      const c = document.getElementById('short-posts');
      if (!posts || posts.length === 0) {
      c.innerHTML += '<div class="post-card"><p>Na tą chwilę w tej kategori nie ma jeszcze żadnych wpisów.</p></div>';
      return;
      }
      posts.forEach(p => {
      let thumbnailHTML = '';
      if (p.thumbnail) {
        thumbnailHTML = `<div class="thumb"><img src="${p.thumbnail}" alt="Miniaturka ${p.title}"></div>`;
      }
      c.innerHTML += `
      <div class="post-card">
      ${thumbnailHTML}
      <h3>${p.title}</h3>
      <a href="${"../"+p.path}">Czytaj więcej</a>
      </div>`;
      });
      }
      </script>
    <script src="/js/footer.js"></script>
</body>


</html>
